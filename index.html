  <style>
    :root {
      /* Couleurs principales */
      --noir: #212121;
      --blanc: #FFFFFF;

      /* Couleurs secondaires */
      --gris-fonce: #504f4c;
      --beige-bordure: #dbd6c6;
      --beige-fond: #f4f2ec;

      /* Couleurs d'accentuation */
      --accent-vert: #47e26e;
      --accent-bleu: #478ce2;
      --accent-violet: #756b96;
      --accent-erreur: #ea5153;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--beige-fond);
      color: var(--noir);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      font-weight: 400;
    }

    .brand-bar {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .brand-logo {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: 0.01em;
      color: var(--noir);
      text-decoration: none;
    }

    .brand-tag {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gris-fonce);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--blanc);
      border: 1px solid var(--beige-bordure);
      border-top: 5px solid var(--accent-violet);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(33, 33, 33, 0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gris-fonce);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--beige-fond);
      color: var(--noir);
      border: 1px solid var(--beige-bordure);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-violet);
      display: inline-block;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      color: var(--noir);
    }

    .subtitle {
      color: var(--gris-fonce);
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 0.96rem;
    }

    /* Boutons */
    .primary-btn {
      margin-top: 16px;
      width: 100%;
      padding: 15px 20px;
      background: var(--accent-violet);
      color: var(--blanc);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .primary-btn:hover:not(:disabled) {
      opacity: 0.92;
    }

    .primary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .secondary-btn {
      margin-top: 12px;
      width: 100%;
      padding: 14px 20px;
      background: var(--beige-fond);
      color: var(--noir);
      font-weight: 700;
      font-size: 0.96rem;
      border: 1.5px solid var(--beige-bordure);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .secondary-btn:hover {
      background: var(--beige-bordure);
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .role-card {
      padding: 22px 18px;
      border: 1.5px solid var(--beige-bordure);
      border-radius: 12px;
      background: var(--blanc);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .role-card:hover {
      background: var(--beige-fond);
      border-color: var(--accent-violet);
    }

    .role-card h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--noir);
    }

    .role-card p {
      font-size: 0.88rem;
      color: var(--gris-fonce);
      line-height: 1.45;
    }

    /* Formulaire joueur */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--noir);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .text-input {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--beige-bordure);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--noir);
      background: var(--blanc);
    }

    .text-input:focus {
      outline: none;
      border-color: var(--accent-violet);
    }

    .code-input {
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Sélecteur de numéro 1 à 6 */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .slot-btn {
      padding: 12px 0;
      border: 1.5px solid var(--beige-bordure);
      border-radius: 10px;
      background: var(--beige-fond);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--noir);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .slot-btn:hover:not(:disabled) {
      border-color: var(--accent-violet);
    }

    .slot-btn.selected {
      background: var(--accent-violet);
      border-color: var(--accent-violet);
      color: var(--blanc);
    }

    .slot-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* Code de salle animateur */
    .room-banner {
      background: var(--beige-fond);
      border: 1.5px dashed var(--beige-bordure);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .room-code-display {
      font-family: 'Oswald', sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--noir);
      margin: 4px 0;
    }

    .conn-status {
      font-size: 0.84rem;
      font-weight: 700;
      margin: 6px 0 8px 0;
      color: var(--gris-fonce);
    }

    .conn-status.ok {
      color: #1e8e3e;
    }

    .conn-status.err {
      color: var(--accent-erreur);
    }

    .copy-link-btn {
      margin-top: 6px;
      padding: 8px 14px;
      background: var(--blanc);
      border: 1px solid var(--beige-bordure);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--noir);
      cursor: pointer;
    }

    .copy-link-btn:hover {
      background: var(--beige-bordure);
    }

    /* Liste des joueurs */
    .players-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .player-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border: 1px solid var(--beige-bordure);
      border-radius: 10px;
      background: var(--beige-fond);
      font-size: 0.92rem;
    }

    .player-pill.empty {
      opacity: 0.45;
      background: var(--blanc);
    }

    .player-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--accent-violet);
      color: var(--blanc);
      font-weight: 800;
      font-size: 0.85rem;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .player-pill.empty .player-num {
      background: var(--beige-bordure);
      color: var(--gris-fonce);
    }

    /* Compteur 30s */
    .timer-wrapper {
      margin-bottom: 22px;
    }

    .timer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gris-fonce);
    }

    .timer-seconds {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--noir);
    }

    .timer-seconds.urgent {
      color: var(--accent-erreur);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: var(--beige-fond);
      border: 1px solid var(--beige-bordure);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-violet);
      width: 100%;
      transition: width 0.25s linear, background-color 0.25s ease;
    }

    .progress-fill.urgent {
      background: var(--accent-erreur);
    }

    /* Question & options */
    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 20px;
      color: var(--noir);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      background: var(--blanc);
      border: 1.5px solid var(--beige-bordure);
      color: var(--gris-fonce);
      padding: 14px 16px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.96rem;
      font-weight: 400;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--beige-fond);
      border-color: var(--accent-violet);
      color: var(--noir);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.chosen {
      border-color: var(--accent-bleu);
      background: rgba(71, 140, 226, 0.1);
      color: var(--noir);
    }

    .option-btn.chosen .option-letter {
      background: var(--accent-bleu);
      border-color: var(--accent-bleu);
      color: var(--blanc);
    }

    .option-letter {
      background: var(--beige-fond);
      color: var(--noir);
      border: 1px solid var(--beige-bordure);
      font-weight: 700;
      min-width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      border-color: var(--accent-vert);
      background: rgba(71, 226, 110, 0.15);
      color: var(--noir);
    }

    .option-btn.correct .option-letter {
      background: var(--accent-vert);
      border-color: var(--accent-vert);
      color: var(--noir);
    }

    .option-btn.wrong {
      border-color: var(--accent-erreur);
      background: rgba(234, 81, 83, 0.1);
      color: var(--noir);
    }

    .option-btn.wrong .option-letter {
      background: var(--accent-erreur);
      border-color: var(--accent-erreur);
      color: var(--blanc);
    }
